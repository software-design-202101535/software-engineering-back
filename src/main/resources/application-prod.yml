management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: prometheus, health
  endpoint:
    prometheus:
      access: read-only
    health:
      access: read-only
  metrics:
    tags:
      application: edumanager
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true     # _bucket 생성 → p50/p95/p99 백분위 패널 활성

server:
  tomcat:
    mbeanregistry:
      enabled: true                         # tomcat_threads_busy/current 등 스레드 메트릭 export

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20     # 풀 비교: 10 → 20

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000

encryption:
  key: ${ENCRYPTION_KEY}

fcm:
  enabled: ${FCM_ENABLED:false}
  credentials-path: ${FCM_CREDENTIALS_PATH:}
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
