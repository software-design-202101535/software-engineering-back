services:
  mysql:
    image: mysql:8.0
    container_name: edumanager-mysql
    restart: unless-stopped
    mem_limit: 700m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - edumanager-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M     # 데이터 캐시. mem_limit(700m) 안에 들어가게 고정
      - --max-connections=100              # 기본 151 → 축소. HikariCP 풀(앱 1대)보다 충분히 큼
      - --slow-query-log=ON                # 슬로우 쿼리 로깅 ON
      - --long-query-time=0.1              # 0.1초 초과 쿼리 기록 (부하테스트용)
      - --log-output=TABLE                 # mysql.slow_log 내장 테이블에 적재 → SQL로 조회
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: databack/mysql-backup:1.4.0
    container_name: edumanager-db-backup
    restart: unless-stopped
    mem_limit: 64m
    command: ["dump"]                    # 1.x는 서브커맨드 필수 (없으면 help만 출력)
    environment:
      DB_SERVER: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USERNAME}
      DB_PASS: ${DB_PASSWORD}
      DB_DUMP_INCLUDE: ${DB_NAME}
      DB_DUMP_TARGET: s3://edumanager-db-backup-970547352823-ap-northeast-2-an/edumanager
      DB_DUMP_SAFECHARS: "true"          # 파일명에서 ':' 제거
      DB_DUMP_CRON: "0 0 19 * * *"       # 6필드(초 포함). 19:00 UTC = 04:00 KST (매일 1회)
      AWS_REGION: ap-northeast-2
      # AWS 자격증명은 EC2 instance role(IMDS)로 자동 획득 → 키 env 미설정.
      # IMDSv2 hop limit=2 필요(아래 deploy/RESTORE.md 참고). 안 되면 IAM 사용자 키로 폴백.
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edumanager-network

  app:
    image: ${DOCKER_USERNAME}/edumanager:latest
    container_name: edumanager-app
    restart: unless-stopped
    mem_limit: 1500m
    expose:
      - "8080"
      - "9090"
    environment:
      # 컨테이너 cgroup 한도(1500m) 기준 기본 heap은 25%(~375m)로 너무 작음 → 명시 캡
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_CREDENTIALS_PATH: /app/firebase-adminsdk.json
    volumes:
      - ./firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edumanager-network

  caddy:
    image: caddy:2
    container_name: edumanager-caddy
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - app
      - grafana
    networks:
      - edumanager-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: edumanager-prometheus
    restart: unless-stopped
    mem_limit: 400m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - edumanager-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: edumanager-grafana
    restart: unless-stopped
    mem_limit: 300m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.edumanager.uk
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - edumanager-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: edumanager-node-exporter
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - edumanager-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: edumanager-cadvisor
    restart: unless-stopped
    mem_limit: 200m
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - edumanager-network

volumes:
  mysql-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  caddy-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  edumanager-network:
    driver: bridge
